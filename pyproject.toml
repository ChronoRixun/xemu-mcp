[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xemu-mcp"
version = "0.1.0"
description = "Owned-process stdio MCP tools for the xemu Xbox emulator"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5,<5",
    "mcp>=1.20,<2",
    "Pillow>=11,<13",
    "psutil>=6,<8",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
xemu-mcp = "xemu_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["xemu_mcp*"]
